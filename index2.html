<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Expense Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-brand-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-6 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-white/10 rounded-lg backdrop-blur-sm">
          <i data-lucide="plane-takeoff" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">VoyageSpend</h1>
          <p class="text-xs text-brand-100 font-medium">Travel Expense & Budget Tracker</p>
        </div>
      </div>
      <button id="resetDataBtn" class="text-xs bg-brand-700 hover:bg-brand-900 px-3 py-2 rounded-lg transition border border-brand-500">
        Clear All Data
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Left Column: Input -->
    <div class="space-y-6">
      <!-- Add Expense Form -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-brand-600"></i> Add New Expense
        </h2>
        <form id="expenseForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
            <input type="text" id="descInput" required placeholder="e.g. Flight to Goa, Dinner" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Amount</label>
              <div class="relative">
                <span class="absolute left-3 top-2 text-slate-400 text-sm">&#8377;</span>
                <input type="number" step="any" id="amountInput" required placeholder="0.00" class="w-full pl-7 pr-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Category</label>
              <select id="categoryInput" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm bg-white">
                <option value="Transport">🚗 Transport</option>
                <option value="Food">🍽️ Food & Dining</option>
                <option value="Stay">🏨 Accommodation</option>
                <option value="Activities">🎟️ Activities</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Misc">📦 Miscellaneous</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date</label>
            <input type="date" id="dateInput" required class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm" />
          </div>

          <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl font-medium shadow-sm hover:shadow transition flex items-center justify-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i> Add Expense
          </button>
        </form>
      </div>

    </div>

    <!-- Right Column: Analytics & Expense List -->
    <div class="lg:col-span-2 space-y-6">

      <!-- Summary Metrics Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Total Spent</span>
          <p id="totalSpentDisplay" class="text-2xl font-black text-brand-600 mt-2">&#8377;0.00</p>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Total Budget</span>
          <p id="totalBudgetDisplay" class="text-2xl font-black text-slate-700 mt-2">&#8377;0.00</p>
        </div>

        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Remaining</span>
          <p id="remainingDisplay" class="text-2xl font-black text-emerald-600 mt-2">&#8377;0.00</p>
        </div>

      </div>

      <!-- Budget Progress Bar -->
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold text-slate-600 uppercase">Budget Utilization</span>
          <span id="progressPercent" class="text-xs font-bold text-slate-700">0%</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
          <div id="progressBar" class="bg-brand-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- Expense List -->
      <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <h3 class="text-lg font-bold text-slate-800">Transaction History</h3>
          
          <!-- Category Filter -->
          <select id="filterCategory" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <option value="All">All Categories</option>
            <option value="Transport">Transport</option>
            <option value="Food">Food & Dining</option>
            <option value="Stay">Accommodation</option>
            <option value="Activities">Activities</option>
            <option value="Shopping">Shopping</option>
            <option value="Misc">Miscellaneous</option>
          </select>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-100 text-xs font-semibold text-slate-400 uppercase">
                <th class="py-3 px-3">Date</th>
                <th class="py-3 px-3">Category</th>
                <th class="py-3 px-3">Description</th>
                <th class="py-3 px-3 text-right">Amount</th>
                <th class="py-3 px-3 text-center">Action</th>
              </tr>
            </thead>
            <tbody id="expenseList" class="divide-y divide-slate-50 text-sm">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
          <div id="emptyState" class="py-10 text-center text-slate-400 hidden">
            <i data-lucide="receipt" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
            <p>No expenses recorded yet.</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Application Logic -->
  <script>
    // State - reads 'travel_budget' set by your external page
    let expenses = JSON.parse(localStorage.getItem('travel_expenses')) || [];
    let budget = parseFloat(localStorage.getItem('travel_budget')) || 0;

    // Elements
    const expenseForm = document.getElementById('expenseForm');
    const descInput = document.getElementById('descInput');
    const amountInput = document.getElementById('amountInput');
    const categoryInput = document.getElementById('categoryInput');
    const dateInput = document.getElementById('dateInput');
    const resetDataBtn = document.getElementById('resetDataBtn');
    const filterCategory = document.getElementById('filterCategory');
    const expenseList = document.getElementById('expenseList');
    const emptyState = document.getElementById('emptyState');

    const totalSpentDisplay = document.getElementById('totalSpentDisplay');
    const totalBudgetDisplay = document.getElementById('totalBudgetDisplay');
    const remainingDisplay = document.getElementById('remainingDisplay');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');

    // Default Date to Today
    dateInput.value = new Date().toISOString().split('T')[0];

    // Helper: Category badge styling
    const getCategoryBadge = (category) => {
      const badges = {
        Transport: 'bg-blue-50 text-blue-700 border-blue-200',
        Food: 'bg-amber-50 text-amber-700 border-amber-200',
        Stay: 'bg-indigo-50 text-indigo-700 border-indigo-200',
        Activities: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        Shopping: 'bg-purple-50 text-purple-700 border-purple-200',
        Misc: 'bg-slate-50 text-slate-700 border-slate-200'
      };
      return badges[category] || badges.Misc;
    };

    // Render Function
    function render() {
      // Refresh budget value in case it was updated externally
      budget = parseFloat(localStorage.getItem('travel_budget')) || 0;

      const selectedCategory = filterCategory.value;
      const filteredExpenses = selectedCategory === 'All' 
        ? expenses 
        : expenses.filter(e => e.category === selectedCategory);

      // Render Table
      expenseList.innerHTML = '';
      if (filteredExpenses.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filteredExpenses.forEach((exp) => {
          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-50 transition';
          row.innerHTML = `
            <td class="py-3 px-3 text-slate-500 text-xs">${exp.date}</td>
            <td class="py-3 px-3">
              <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold border ${getCategoryBadge(exp.category)}">
                ${exp.category}
              </span>
            </td>
            <td class="py-3 px-3 font-medium text-slate-800">${exp.desc}</td>
            <td class="py-3 px-3 text-right font-bold text-slate-800">&#8377;${exp.amount.toFixed(2)}</td>
            <td class="py-3 px-3 text-center">
              <button onclick="deleteExpense('${exp.id}')" class="text-slate-400 hover:text-red-500 transition p-1 rounded-lg">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          `;
          expenseList.appendChild(row);
        });
      }

      // Calculate Metrics
      const totalSpent = expenses.reduce((acc, curr) => acc + (curr.amount || 0), 0);
      const remaining = budget - totalSpent;
      const rawPercentage = budget > 0 ? (totalSpent / budget) * 100 : 0;
      const displayPercentage = Math.min(rawPercentage, 100);

      // Update Top Metrics
      totalSpentDisplay.textContent = `\u20B9${totalSpent.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
      totalBudgetDisplay.textContent = `\u20B9${budget.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
      
      remainingDisplay.textContent = `\u20B9${remaining.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
      if (remaining < 0) {
        remainingDisplay.className = "text-2xl font-black text-red-600 mt-2";
      } else {
        remainingDisplay.className = "text-2xl font-black text-emerald-600 mt-2";
      }

      // Update Progress Bar
      progressBar.style.width = `${displayPercentage}%`;
      progressPercent.textContent = `${rawPercentage.toFixed(0)}%`;
      if (rawPercentage >= 100) {
        progressBar.className = "bg-red-500 h-3 rounded-full transition-all duration-300";
      } else if (rawPercentage >= 80) {
        progressBar.className = "bg-amber-500 h-3 rounded-full transition-all duration-300";
      } else {
        progressBar.className = "bg-brand-600 h-3 rounded-full transition-all duration-300";
      }

      // Initialize Icons
      lucide.createIcons();
    }

    // Save to LocalStorage
    function saveState() {
      localStorage.setItem('travel_expenses', JSON.stringify(expenses));
      render();
    }

    // Add Expense
    expenseForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const parsedAmount = parseFloat(amountInput.value);
      if (isNaN(parsedAmount) || parsedAmount <= 0) return;

      const newExpense = {
        id: Date.now().toString(),
        desc: descInput.value.trim(),
        amount: parsedAmount,
        category: categoryInput.value,
        date: dateInput.value
      };

      expenses.unshift(newExpense);
      saveState();

      // Reset form fields
      descInput.value = '';
      amountInput.value = '';
      descInput.focus();
    });

    // Delete Expense
    window.deleteExpense = function(id) {
      expenses = expenses.filter(exp => exp.id !== id);
      saveState();
    };

    // Filter Change
    filterCategory.addEventListener('change', render);

    // Reset All
    resetDataBtn.addEventListener('click', () => {
      if (confirm("Are you sure you want to clear all expenses and budget data?")) {
        expenses = [];
        budget = 0;
        localStorage.clear();
        render();
      }
    });

    // Initial Load
    render();
  </script>
</body>
</html>
